<!DOCTYPE html>

<head>

    <title>GamerVault - Bem-vindo</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

        <div class="login-content">

            <p class="text-continuar">Clique na tela para continuar</p>

    </div>

    <script src="/script.js"></script>

</html>
